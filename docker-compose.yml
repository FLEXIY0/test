services:
  video:
    build: .
    image: faceless-video:latest
    env_file: .env
    environment:
      # LLM keys via Docker secrets (only the one for your SCRIPT_PROVIDER is
      # needed for --topic generation). Missing secret files are simply unused.
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      DASHSCOPE_API_KEY_FILE: /run/secrets/dashscope_api_key
    secrets:
      - anthropic_api_key
      - gemini_api_key
      - dashscope_api_key
    volumes:
      - ./output:/app/output          # finished videos land here
      - ./assets:/app/assets          # your background music, custom images
      - ./scripts:/app/scripts        # edit scripts on the host
      - ./secrets:/app/secrets        # YouTube OAuth client_secret/token
    # Rendering is CPU-bound; give ffmpeg room.
    deploy:
      resources:
        limits:
          memory: 2G

secrets:
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  gemini_api_key:
    file: ./secrets/gemini_api_key
  dashscope_api_key:
    file: ./secrets/dashscope_api_key
